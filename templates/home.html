<!DOCTYPE html>

<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

```
<title>Student Performance Prediction</title>

<style>
    * {
        box-sizing: border-box;
        margin: 0;
        padding: 0;
    }

    body {
        font-family: Arial, sans-serif;
        min-height: 100vh;
        padding: 40px 20px;

        background: linear-gradient(135deg, #667eea, #764ba2);
    }

    .container {
        width: 100%;
        max-width: 700px;
        margin: auto;
    }

    .card {
        background: white;
        padding: 40px;
        border-radius: 18px;

        box-shadow: 0 20px 50px rgba(0, 0, 0, 0.2);
    }

    h1 {
        text-align: center;
        margin-bottom: 10px;
        color: #333;
    }

    .description {
        text-align: center;
        color: #777;
        margin-bottom: 30px;
    }

    .form-group {
        margin-bottom: 20px;
    }

    label {
        display: block;
        margin-bottom: 8px;
        font-weight: bold;
        color: #444;
    }

    select,
    input {
        width: 100%;
        padding: 12px;

        border: 1px solid #ddd;
        border-radius: 8px;

        font-size: 15px;
        outline: none;

        transition: 0.2s;
    }

    select:focus,
    input:focus {
        border-color: #667eea;
        box-shadow: 0 0 0 3px rgba(102, 126, 234, 0.15);
    }

    .btn {
        width: 100%;
        padding: 14px;

        border: none;
        border-radius: 8px;

        background: linear-gradient(135deg, #667eea, #764ba2);
        color: white;

        font-size: 17px;
        font-weight: bold;

        cursor: pointer;
        transition: 0.3s;
    }

    .btn:hover {
        transform: translateY(-2px);
        box-shadow: 0 8px 20px rgba(102, 126, 234, 0.35);
    }

    .result {
        margin-top: 25px;
        padding: 20px;

        text-align: center;

        background: #f3f4ff;
        border-radius: 10px;

        color: #4c3fb1;
    }

    .result h2 {
        font-size: 22px;
    }

    .back {
        display: block;
        text-align: center;
        margin-top: 20px;

        color: #667eea;
        text-decoration: none;
        font-weight: bold;
    }

    @media (max-width: 600px) {
        .card {
            padding: 25px;
        }

        h1 {
            font-size: 26px;
        }
    }
</style>
```

</head>

<body>

<div class="container">

```
<div class="card">

    <h1>Student Exam Performance</h1>

    <p class="description">
        Enter the student's information to predict the mathematics score.
    </p>

    <form action="{{ url_for('predict_datapoint') }}" method="post">

        <div class="form-group">
            <label>Gender</label>

            <select name="gender" required>
                <option value="" selected disabled>Select Gender</option>
                <option value="male">Male</option>
                <option value="female">Female</option>
            </select>
        </div>


        <div class="form-group">
            <label>Race or Ethnicity</label>

            <select name="ethnicity" required>
                <option value="" selected disabled>Select Ethnicity</option>
                <option value="group A">Group A</option>
                <option value="group B">Group B</option>
                <option value="group C">Group C</option>
                <option value="group D">Group D</option>
                <option value="group E">Group E</option>
            </select>
        </div>


        <div class="form-group">
            <label>Parental Level of Education</label>

            <select name="parental_level_of_education" required>
                <option value="" selected disabled>
                    Select Parent Education
                </option>

                <option value="associate's degree">
                    Associate's Degree
                </option>

                <option value="bachelor's degree">
                    Bachelor's Degree
                </option>

                <option value="high school">
                    High School
                </option>

                <option value="master's degree">
                    Master's Degree
                </option>

                <option value="some college">
                    Some College
                </option>

                <option value="some high school">
                    Some High School
                </option>
            </select>
        </div>


        <div class="form-group">
            <label>Lunch Type</label>

            <select name="lunch" required>
                <option value="" selected disabled>
                    Select Lunch Type
                </option>

                <option value="free/reduced">
                    Free / Reduced
                </option>

                <option value="standard">
                    Standard
                </option>
            </select>
        </div>


        <div class="form-group">
            <label>Test Preparation Course</label>

            <select name="test_preparation_course" required>
                <option value="" selected disabled>
                    Select Course
                </option>

                <option value="none">None</option>
                <option value="completed">Completed</option>
            </select>
        </div>


        <div class="form-group">
            <label>Reading Score (0 - 100)</label>

            <input
                type="number"
                name="reading_score"
                placeholder="Enter reading score"
                min="0"
                max="100"
                required>
        </div>


        <div class="form-group">
            <label>Writing Score (0 - 100)</label>

            <input
                type="number"
                name="writing_score"
                placeholder="Enter writing score"
                min="0"
                max="100"
                required>
        </div>


        <button class="btn" type="submit">
            Predict Mathematics Score
        </button>

    </form>


    {% if results is not none %}

    <div class="result">

        <h2>
            Predicted Mathematics Score:
            {{ results }}
        </h2>

    </div>

    {% endif %}


    <a href="{{ url_for('index') }}" class="back">
        ← Back to Home
    </a>

</div>
```

</div>

</body>
</html>
